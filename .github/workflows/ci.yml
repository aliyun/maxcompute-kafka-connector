# PR 回归门禁：只跑无需云凭据的单元回归（纯转换 / 配置 / 类型映射）。
# 需要真实 MaxCompute 凭据的 Kafka Connect 集成用例（@Category(IntegrationTest.class)）
# 不在这里执行，见 integration-tests.yml；这里绿灯不代表集成通过。
name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  unit-tests:
    name: Unit tests (no cloud credentials)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['8', '11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Run unit tests
        # clean 保证 surefire 报告只来自本次运行；默认 profile 已排除 IntegrationTest 分类
        run: mvn -B -ntp clean test

      - name: Verify test discovery and counts
        run: python3 tools/check-test-reports.py --profile unit

      - name: Record gate scope
        if: always()
        run: |
          {
            echo "## PR 门禁范围（java ${{ matrix.java-version }}）"
            echo
            echo "- 已执行：无需云凭据的单元回归（转换 / 配置 / 类型映射），并校验发现范围与用例数"
            echo "- 未执行：Kafka + MaxCompute 集成回归（需要云凭据，见 integration-tests 工作流）"
            echo "- 本检查变绿**不**代表集成链路通过"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java${{ matrix.java-version }}
          path: target/surefire-reports/
          if-no-files-found: error
